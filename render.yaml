databases:
  - name: igr-postgres
    databaseName: igr_db
    user: igr_user
    plan: free

services:
  - type: web
    name: igr-maharashtra-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: igr-postgres
          property: connectionString
      - key: HEADLESS
        value: "true"
      - key: STORAGE_DIR
        value: ./storage/documents
      - key: JOB_CONCURRENCY
        value: "1"
      - key: CORS_ORIGINS
        sync: false
